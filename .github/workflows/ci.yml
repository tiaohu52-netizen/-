name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 7-gate quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Sync dependencies (cached)
        uses: Swatinem/rust-cache@v2
      - name: Install project + dev
        run: uv sync --extra dev

      - name: Run authoritative 7-gate quality check
        # scripts/quality_gate.py is the single source of truth (CONTRIBUTING.md).
        # The CI environment matrix proves the gate works on all three OSes;
        # local development is Windows-only by default.
        run: uv run python scripts/quality_gate.py

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            .coverage
            htmlcov/
            coverage.xml
          if-no-files-found: ignore
